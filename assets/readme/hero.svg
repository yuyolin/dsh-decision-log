<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">dsh-decision-log · 决策日志</title>
  <desc id="desc">DeepSeek Harness 插件:把 AI 拍板的决定写进项目里的 DECISIONS.md,新对话自动注入摘要。右侧是一张贴在深色终端上的手账纸,展示 DECISIONS.md 的真实记录格式,荧光笔划重点、红笔批注、便利贴提示注入。</desc>

  <defs>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141630"/>
      <stop offset="1" stop-color="#0E0F1E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg-glow)"/>

  <!-- 左侧:标题区(深色终端) -->
  <g transform="translate(56 40)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#A79BF0">DEEPSEEK HARNESS · PLUGIN</text>

    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="54" font-weight="900" fill="#F4F5FA">dsh-decision-log</text>

    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#C9CCE6">决策日志 · AI 的「小本本」</text>

    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">把每个拍板的决定,写进项目里的 DECISIONS.md</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">新对话自动带上记忆——不重复问、不随手推翻、</text>
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">换任何 AI 都能接着读。</text>

    <!-- 特性 chips:终端风格 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9CCE6">
      <rect x="0" y="240" width="152" height="30" rx="6" fill="#151729" stroke="#2B2F4A"/>
      <circle cx="20" cy="255" r="4" fill="#6C5CE7"/>
      <text x="34" y="260">本地纯 Markdown</text>

      <rect x="164" y="240" width="128" height="30" rx="6" fill="#151729" stroke="#2B2F4A"/>
      <circle cx="184" cy="255" r="4" fill="#3DD68C"/>
      <text x="198" y="260">任何 AI 可读</text>

      <rect x="304" y="240" width="140" height="30" rx="6" fill="#151729" stroke="#2B2F4A"/>
      <circle cx="324" cy="255" r="4" fill="#F2B04C"/>
      <text x="338" y="260">token 恒定成本</text>
    </g>

    <text x="0" y="326" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#6E7291">MIT License · Node ^22.19 · dsh 0.1.x · 纯 JS 无原生依赖</text>
  </g>

  <!-- 右侧:手账纸样张 -->
  <g transform="translate(648 44)">
    <!-- 纸张阴影 -->
    <rect x="8" y="8" width="500" height="320" rx="6" fill="#000000" opacity="0.22"/>
    <rect x="4" y="4" width="500" height="320" rx="6" fill="#000000" opacity="0.12"/>

    <!-- 纸面 -->
    <rect x="0" y="0" width="500" height="320" rx="6" fill="#F8F2E4"/>

    <!-- 右下折角 -->
    <path d="M 482 320 L 500 302 L 500 320 Z" fill="#DCCFB2"/>
    <path d="M 482 320 L 500 302" stroke="#C4B48F" stroke-width="1.5"/>

    <!-- 顶部胶带 -->
    <g transform="translate(180 -8) rotate(-3 70 10)">
      <rect x="0" y="0" width="140" height="20" rx="2" fill="#E9E2CF" opacity="0.8"/>
      <line x1="8" y1="4" x2="40" y2="4" stroke="#D8CFB4" stroke-width="1" opacity="0.6"/>
      <line x1="100" y1="16" x2="132" y2="16" stroke="#D8CFB4" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 页眉:圆珠笔红字 -->
    <text x="22" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#D64541">.dsh/DECISIONS.md</text>
    <line x1="22" y1="30" x2="160" y2="30" stroke="#D64541" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 内容 -->
    <g transform="translate(22 40)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800" fill="#3A352C"># DECISIONS</text>
      <text x="0" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#A89C85">&lt;!-- dsh-decision-log v1 --&gt;</text>

      <!-- 荧光笔划过标题 -->
      <rect x="-3" y="52" width="408" height="11" rx="2" fill="#F2B04C" opacity="0.35"/>
      <text x="0" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#3A352C">## [2026-08-24T15:30] 用 JWT 不用 session cookie</text>
      <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6B6455">- 状态: </text>
      <text x="54" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#2E7D5B">accepted</text>
      <text x="0" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6B6455">- 上下文: 登录模块改造</text>
      <text x="0" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6B6455">- 备选: [session cookie, OAuth]</text>
      <text x="0" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#B8791B">- 理由: </text>
      <text x="60" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3A352C">跨端无状态,避免 session 同步</text>

      <!-- 红笔批注 -->
      <path d="M 296 152 C 306 142, 314 142, 322 150" fill="none" stroke="#D64541" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="324" cy="153" r="2.4" fill="#D64541"/>
      <text x="334" y="156" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#D64541">最值钱的一行</text>
      <line x1="334" y1="160" x2="424" y2="160" stroke="#D64541" stroke-width="1.4" stroke-linecap="round"/>

      <line x1="0" y1="176" x2="456" y2="176" stroke="#D8CFB4" stroke-dasharray="3 5"/>

      <text x="0" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#3A352C">## [2026-08-24T16:10] 缓存用 Redis 不用 Memcached</text>
      <text x="0" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#B8791B">- 理由: </text>
      <text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3A352C">持久化更强</text>

      <!-- 便利贴:注入提示 -->
      <g transform="translate(14 240) rotate(1.2)">
        <rect x="0" y="0" width="442" height="40" rx="3" fill="#FFE9A5"/>
        <path d="M 0 0 L 18 0 L 0 18 Z" fill="#F2D98C"/>
        <text x="18" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#5A4A2A">已注入新会话:2 条决策 · 2000 字符上限 · ≈1100 token</text>
      </g>
    </g>
  </g>
</svg>
