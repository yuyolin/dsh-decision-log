<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">dsh-decision-log · 决策日志</title>
  <desc id="desc">DeepSeek Harness 插件:把 AI 拍板的决定写进项目里的 DECISIONS.md,新对话自动注入摘要。右侧展示 DECISIONS.md 的真实记录格式。</desc>

  <defs>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141630"/>
      <stop offset="1" stop-color="#0F1020"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg-glow)"/>

  <!-- 左侧:标题区 -->
  <g transform="translate(56 46)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#A79BF0">DEEPSEEK HARNESS · PLUGIN</text>

    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="800" fill="#F2F3FA">dsh-decision-log</text>

    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#C9CCE6">决策日志 · AI 的「小本本」</text>

    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">把每个拍板的决定,写进项目里的 DECISIONS.md</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">新对话自动带上记忆——不重复问、不随手推翻、</text>
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#9AA0BF">换任何 AI 都能接着读。</text>

    <!-- 特性 chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#D5D8F2">
      <rect x="0" y="236" width="176" height="32" rx="16" fill="#1A1C33" stroke="#2B2F4A"/>
      <circle cx="20" cy="252" r="4" fill="#6C5CE7"/>
      <text x="34" y="257">本地纯 Markdown</text>

      <rect x="190" y="236" width="150" height="32" rx="16" fill="#1A1C33" stroke="#2B2F4A"/>
      <circle cx="210" cy="252" r="4" fill="#3DD68C"/>
      <text x="224" y="257">任何 AI 可读</text>

      <rect x="354" y="236" width="172" height="32" rx="16" fill="#1A1C33" stroke="#2B2F4A"/>
      <circle cx="374" cy="252" r="4" fill="#F2B04C"/>
      <text x="388" y="257">token 恒定成本</text>
    </g>

    <text x="0" y="318" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#6E7291">MIT License · Node ^22.19 · dsh 0.1.x · 纯 JS 无原生依赖</text>
  </g>

  <!-- 右侧:DECISIONS.md 样张 -->
  <g transform="translate(644 36)">
    <rect x="0" y="0" width="500" height="328" rx="16" fill="#151729" stroke="#262A45"/>
    <rect x="0" y="0" width="500" height="36" rx="16" fill="#1B1D35"/>
    <rect x="0" y="18" width="500" height="18" fill="#1B1D35"/>
    <circle cx="22" cy="18" r="4.5" fill="#34375A"/>
    <circle cx="38" cy="18" r="4.5" fill="#34375A"/>
    <circle cx="54" cy="18" r="4.5" fill="#34375A"/>
    <text x="72" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6E7291">.dsh/DECISIONS.md</text>

    <g transform="translate(22 44)">
      <text x="0" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#F2F3FA"># DECISIONS</text>
      <text x="0" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#565A7D">&lt;!-- dsh-decision-log v1 --&gt;</text>

      <text x="0" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D5D8F2">## [2026-08-24T15:30] 用 JWT 不用 session cookie</text>
      <text x="0" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA0BF">- 状态: </text>
      <text x="54" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#3DD68C">accepted</text>
      <text x="0" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA0BF">- 上下文: 登录模块改造</text>
      <text x="0" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA0BF">- 备选: [session cookie, OAuth]</text>
      <text x="0" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F2B04C">- 理由: </text>
      <text x="60" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA0BF">跨端无状态,避免 session 同步</text>

      <rect x="330" y="148" width="76" height="20" rx="10" fill="#F2B04C" opacity="0.14" stroke="#F2B04C" stroke-opacity="0.55"/>
      <text x="348" y="162" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#F2B04C">最值钱的一行</text>

      <line x1="0" y1="180" x2="456" y2="180" stroke="#262A45" stroke-dasharray="4 6"/>

      <text x="0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D5D8F2">## [2026-08-24T16:10] 缓存用 Redis 不用 Memcached</text>
      <text x="0" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F2B04C">- 理由: </text>
      <text x="60" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA0BF">持久化更强</text>
    </g>

    <!-- 注入摘要条 -->
    <g transform="translate(22 282)">
      <rect x="0" y="0" width="456" height="34" rx="10" fill="#6C5CE7" opacity="0.16" stroke="#6C5CE7" stroke-opacity="0.45"/>
      <circle cx="16" cy="17" r="4" fill="#6C5CE7"/>
      <text x="30" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9CCE6">已注入新会话:2 条决策 · 2000 字符上限 · ≈1100 token</text>
    </g>
  </g>
</svg>
